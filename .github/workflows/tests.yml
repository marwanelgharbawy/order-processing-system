name: Bookstore tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          # Disposable test credentials, not a deployed database.
          MYSQL_ROOT_PASSWORD: bookstore-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pbookstore-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ job.services.mysql.ports[3306] }}
      DB_USER: root
      DB_PASS: bookstore-ci-only
      DB_NAME: BookstoreDB
      SESSION_SECRET: bookstore-isolated-test-session-secret
      CI_MYSQL_TEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run API and frontend checks
        run: npm test
      - name: Import fresh schema, sample data and triggers
        working-directory: .
        run: |
          for file in db/schema.sql db/seed.sql db/triggers.sql; do
            MYSQL_PWD="$DB_PASS" mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" < "$file"
          done
      - name: Run real MySQL integration checks
        run: npm run test:mysql
